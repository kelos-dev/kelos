name: Deploy to Dev

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-cluster
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      KELOS_NAMESPACE: ${{ vars.KELOS_NAMESPACE || 'default' }}
      KELOS_API_HOSTNAME: dev-cluster.kelos.dev
      KELOS_SESSION_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARED_VERSION: 2026.10.5
      CLOUDFLARED_DEB_SHA256: 149d1ec4ac8e58bdbf08a41cc42347da9184d9fb4ef0df6528d75c90a85ac0ed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4

      - name: Install cloudflared
        run: |
          CLOUDFLARED_DEB="${RUNNER_TEMP}/cloudflared.deb"
          curl --fail --location --silent --show-error \
            --output "${CLOUDFLARED_DEB}" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "${CLOUDFLARED_DEB_SHA256}  ${CLOUDFLARED_DEB}" | sha256sum --check
          sudo dpkg --install "${CLOUDFLARED_DEB}"

      - name: Connect to dev cluster
        env:
          DEV_CLUSTER_KUBECONFIG: ${{ secrets.DEV_CLUSTER_KUBECONFIG }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          for name in DEV_CLUSTER_KUBECONFIG TUNNEL_SERVICE_TOKEN_ID TUNNEL_SERVICE_TOKEN_SECRET; do
            if [ -z "${!name}" ]; then
              echo "${name} is required" >&2
              exit 1
            fi
          done

          KUBECONFIG_PATH="${RUNNER_TEMP}/dev-cluster-kubeconfig"
          printf '%s' "${DEV_CLUSTER_KUBECONFIG}" > "${KUBECONFIG_PATH}"
          chmod 600 "${KUBECONFIG_PATH}"
          KUBE_CLUSTER=$(KUBECONFIG="${KUBECONFIG_PATH}" kubectl config view \
            --minify -o jsonpath='{.contexts[0].context.cluster}')
          KUBECONFIG="${KUBECONFIG_PATH}" kubectl config set-cluster "${KUBE_CLUSTER}" \
            --server=https://127.0.0.1:6443

          CLOUDFLARED_LOG="${RUNNER_TEMP}/cloudflared-access.log"
          cloudflared access tcp \
            --hostname "${KELOS_API_HOSTNAME}" \
            --url 127.0.0.1:6443 \
            >"${CLOUDFLARED_LOG}" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/cloudflared-access.pid"

          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 6443; then
              break
            fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 6443; then
            cat "${CLOUDFLARED_LOG}" >&2
            exit 1
          fi

          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "${GITHUB_ENV}"
          KUBECONFIG="${KUBECONFIG_PATH}" kubectl get --raw=/readyz

      - name: Build CLI
        run: make build WHAT=cmd/kelos

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version v1.20.2 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --set global.leaderElection.namespace=cert-manager \
            --set resources.requests.cpu=50m \
            --set resources.requests.memory=64Mi \
            --set webhook.resources.requests.cpu=50m \
            --set webhook.resources.requests.memory=64Mi \
            --set cainjector.resources.requests.cpu=50m \
            --set cainjector.resources.requests.memory=64Mi
          kubectl rollout status deployment/cert-manager -n cert-manager --timeout=300s
          kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=300s
          kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=300s

      - name: Create Kelos namespace
        run: kubectl create namespace kelos-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply github-webhook-secret
        env:
          KELOS_WEBHOOK_SECRET: ${{ secrets.KELOS_WEBHOOK_SECRET }}
          KELOS_GITHUB_APP_ID: ${{ secrets.KELOS_GITHUB_APP_ID }}
          KELOS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.KELOS_GITHUB_APP_INSTALLATION_ID }}
          KELOS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.KELOS_GITHUB_APP_PRIVATE_KEY }}
        run: |
          for name in KELOS_WEBHOOK_SECRET KELOS_GITHUB_APP_ID KELOS_GITHUB_APP_INSTALLATION_ID KELOS_GITHUB_APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "${name} is required" >&2
              exit 1
            fi
          done

          # Apply github-webhook-secret in the spawner namespace so the
          # WebhookGateway (self-development/webhookgateway.yaml) can resolve it:
          #   - webhook-secret: HMAC secret for github.secretRef (inbound verify)
          #   - appID/installationID/privateKey: GitHub App credentials for
          #     github.credentialsRef (PR-file enrichment + status reporting,
          #     and resolving .Branch for issue_comment events on PRs)
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$KELOS_GITHUB_APP_PRIVATE_KEY" > "$KEY_FILE"
          kubectl create secret generic github-webhook-secret \
            --namespace "${KELOS_NAMESPACE}" \
            --from-literal=webhook-secret="$KELOS_WEBHOOK_SECRET" \
            --from-literal=appID="$KELOS_GITHUB_APP_ID" \
            --from-literal=installationID="$KELOS_GITHUB_APP_INSTALLATION_ID" \
            --from-file=privateKey="$KEY_FILE" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Apply Console server authentication secret
        env:
          KELOS_CONSOLE_TOKEN: ${{ secrets.KELOS_CONSOLE_TOKEN }}
        run: |
          if [ -z "${KELOS_CONSOLE_TOKEN}" ]; then
            echo "KELOS_CONSOLE_TOKEN is required" >&2
            exit 1
          fi
          kubectl create secret generic kelos-console-server-auth \
            --namespace kelos-system \
            --from-literal=token="${KELOS_CONSOLE_TOKEN}" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Install kelos
        run: |
          # FIXME: Remove after the dev cluster has migrated to the Console server.
          kubectl delete \
            deployment/kelos-session-server \
            service/kelos-session-server \
            serviceaccount/kelos-session-server \
            secret/kelos-session-server-auth \
            --namespace kelos-system \
            --ignore-not-found
          kubectl delete \
            clusterrole/kelos-session-server-role \
            clusterrolebinding/kelos-session-server-rolebinding \
            --ignore-not-found

          cat > /tmp/kelos-dev-values.yaml <<'EOF'
          image:
            tag: main
            pullPolicy: Always
          spawner:
            resources:
              requests: "cpu=100m,memory=128Mi"
          controller:
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          consoleServer:
            enabled: true
            secretName: kelos-console-server-auth
            secureCookie: true
            webPush:
              enabled: true
              storageNamespace: kelos-console-notifications
              secretName: kelos-console-web-push
              subject: https://github.com/kelos-dev/kelos
            service:
              type: NodePort
          # NOTE: webhookServer.gateway is intentionally left at its disabled
          # default. The dev cluster's kelos-webhook-gateway Gateway and
          # kelos-webhook-route HTTPRoute are managed out of band, so enabling
          # the chart-managed resources would create an ownership conflict.
          #
          # Required external configuration: the HTTPRoute routes the /webhook/
          # prefix to the kelos-webhook-gateway-server Service, and the
          # kelos-dev/kelos repository webhook URL uses the 'kelos'
          # WebhookGateway's /webhook/<KELOS_NAMESPACE>/kelos status.path.
          #
          # gatewayServer runs the gateway-mode webhook server: it routes by
          # per-gateway path using WebhookGateway resources (the self-development
          # spawners reference the 'kelos' gateway via gatewayRef) and resolves
          # each gateway's HMAC secret and API credentials.
          webhookServer:
            gatewayServer:
              enabled: true
              service:
                type: NodePort
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
          EOF
          bin/kelos install -f /tmp/kelos-dev-values.yaml \
            --set-string consoleServer.defaultNamespace="${KELOS_NAMESPACE}"
          kubectl patch service kelos-console-server -n kelos-system --type=merge \
            --patch '{"spec":{"ports":[{"name":"http","nodePort":30080,"port":80,"protocol":"TCP","targetPort":"http"}]}}'
          kubectl rollout restart deployment/kelos-controller-manager -n kelos-system
          kubectl rollout status deployment/kelos-controller-manager -n kelos-system --timeout=300s
          kubectl get session --all-namespaces \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' | \
            while read -r namespace name; do
              kubectl patch "session/${name}" -n "${namespace}" --type=merge \
                --patch "{\"spec\":{\"worker\":{\"podOverrides\":{\"labels\":{\"app.kubernetes.io/version\":\"${KELOS_SESSION_VERSION}\"}}}}}"
            done
          kubectl rollout restart deployment/kelos-console-server -n kelos-system
          kubectl rollout restart deployment -l kelos.dev/component=spawner -n "${KELOS_NAMESPACE}"
          kubectl rollout restart deployment/kelos-webhook-gateway-server -n kelos-system
          kubectl rollout status deployment/kelos-console-server -n kelos-system --timeout=300s
          kubectl rollout status deployment -l kelos.dev/component=spawner -n "${KELOS_NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/kelos-webhook-gateway-server -n kelos-system --timeout=300s

      - name: Apply self-development resources
        run: kubectl apply -f self-development/ -n "${KELOS_NAMESPACE}"

      - name: Apply agora self-development resources
        run: kubectl apply -f self-development/agora/ -n "${KELOS_NAMESPACE}"

      - name: Apply kanon self-development resources
        run: kubectl apply -f self-development/kanon/ -n "${KELOS_NAMESPACE}"

      - name: Apply Open Actions self-development resources
        run: kubectl apply -f self-development/open-actions/ -n "${KELOS_NAMESPACE}"

      - name: Show Cloudflare Access logs
        if: failure()
        run: cat "${RUNNER_TEMP}/cloudflared-access.log" 2>/dev/null || true

      - name: Stop Cloudflare Access proxy
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/cloudflared-access.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/cloudflared-access.pid")" 2>/dev/null || true
          fi

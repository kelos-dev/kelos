<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title description">
  <title id="title">Kelos workflows with shared configuration and configurable runtimes</title>
  <desc id="description">Tasks and Sessions reference the same Workspace for a Git repository, files, setup, and Git credentials, and the same AgentConfig for instructions, skills, plugins, and MCP servers. A TaskSpawner creates Tasks from events or schedules, while interactive Sessions support different coding agents. Each worker has its own agent, model, image, compute, volumes, environment variables, and secrets defined in its worker configuration. Workloads run on Kubernetes and can produce branches, commits, pull requests, and task outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 9 6 L 2 10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="820" rx="24" fill="#f8fafc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0f172a">
    <text x="40" y="55" font-size="32" font-weight="700">Your workflows. Your environment.</text>

    <rect x="28" y="92" width="596" height="172" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="56" y="138" font-size="28" font-weight="700" fill="#1e40af">Repository &amp; files</text>
    <rect x="438" y="113" width="158" height="36" rx="8" fill="#dbeafe"/>
    <text x="517" y="138" font-size="21" text-anchor="middle" fill="#1e40af">Workspace</text>
    <text x="56" y="191" font-size="23" fill="#334155">Git repo + ref · injected files</text>
    <text x="56" y="232" font-size="23" fill="#334155">Setup command · Git credentials</text>

    <rect x="656" y="92" width="596" height="172" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="684" y="138" font-size="28" font-weight="700" fill="#166534">Skills &amp; tools</text>
    <rect x="1046" y="113" width="178" height="36" rx="8" fill="#dcfce7"/>
    <text x="1135" y="138" font-size="21" text-anchor="middle" fill="#166534">AgentConfig</text>
    <text x="684" y="191" font-size="23" fill="#334155">Instructions · skills · plugins</text>
    <text x="684" y="232" font-size="23" fill="#334155">MCP servers</text>

    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round">
      <path d="M 326 264 V 320 H 1028"/>
      <path d="M 954 264 V 320"/>
    </g>

    <rect x="28" y="348" width="1224" height="400" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="52" y="379" font-size="19" font-weight="700" letter-spacing="1.5" fill="#475569">RUN ON KUBERNETES</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 554 320 V 398"/>
      <path d="M 1028 320 V 398"/>
    </g>

    <rect x="52" y="400" width="712" height="216" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="76" y="434" font-size="25" font-weight="700" fill="#92400e">Automated Tasks</text>
    <rect x="76" y="462" width="218" height="100" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="185" y="500" font-size="23" font-weight="600" text-anchor="middle" fill="#5b21b6">TaskSpawner</text>
    <text x="185" y="536" font-size="21" text-anchor="middle" fill="#475569">Events · schedules</text>
    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M 294 512 H 330 V 478 H 382"/>
      <path d="M 330 512 V 542 H 382"/>
    </g>
    <g fill="#ffffff" stroke="#fbbf24" stroke-width="1.5">
      <rect x="384" y="454" width="356" height="48" rx="10"/>
      <rect x="384" y="518" width="356" height="48" rx="10"/>
    </g>
    <text x="408" y="486" font-size="23">Task · Fix issue #3</text>
    <text x="408" y="550" font-size="23">Task · Fix issue #4</text>
    <text x="76" y="598" font-size="20" fill="#92400e">Run agent jobs from events or schedules</text>

    <rect x="792" y="400" width="436" height="216" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="816" y="434" font-size="25" font-weight="700" fill="#155e75">Interactive Sessions</text>
    <g fill="#ffffff" stroke="#67e8f9" stroke-width="1.5">
      <rect x="816" y="454" width="388" height="48" rx="10"/>
      <rect x="816" y="518" width="388" height="48" rx="10"/>
    </g>
    <text x="840" y="486" font-size="23">Session · Codex</text>
    <text x="840" y="550" font-size="23">Session · Claude Code</text>
    <text x="816" y="598" font-size="20" fill="#155e75">Connect from CLI or Console</text>

    <rect x="52" y="640" width="1176" height="84" rx="12" fill="#f1f5f9"/>
    <text x="76" y="674" font-size="23" font-weight="600">Configure each worker</text>
    <text x="76" y="708" font-size="23" fill="#334155">Agent + model + image · CPU / memory · volumes · env + secrets</text>
    <path d="M 640 750 V 775" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="640" y="806" font-size="23" text-anchor="middle" fill="#475569">Branches · commits · pull requests · task outputs</text>
  </g>
</svg>

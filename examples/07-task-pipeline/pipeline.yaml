apiVersion: kelos.dev/v1alpha2
kind: TaskPipeline
metadata:
  name: auth-feature
spec:
  tasks:
    - name: scaffold
      taskTemplate:
        worker:
          type: claude-code
          credentials:
            type: oauth
            secretRef:
              name: claude-credentials
          workspaceRef:
            name: my-workspace
        branch: feature/auth
        prompt: |
          Scaffold a user authentication module with the following:
          - A login endpoint (POST /auth/login)
          - A registration endpoint (POST /auth/register)
          - JWT token generation and validation
          - Basic middleware for protected routes

          Create the code, commit your changes, and push the branch.

    - name: write-tests
      dependsOn:
        - scaffold
      taskTemplate:
        worker:
          type: claude-code
          credentials:
            type: oauth
            secretRef:
              name: claude-credentials
          workspaceRef:
            name: my-workspace
        branch: feature/auth
        prompt: |
          The scaffold task created an auth module on branch {{index .Tasks "scaffold" 0 "Results" "branch"}}.

          Write comprehensive tests for the authentication module:
          - Unit tests for token generation and validation
          - Integration tests for login and registration endpoints
          - Edge cases: invalid credentials, expired tokens, duplicate registration

          Run the tests to make sure they pass. Commit and push.

    - name: open-pr
      dependsOn:
        - write-tests
      taskTemplate:
        worker:
          type: claude-code
          credentials:
            type: oauth
            secretRef:
              name: claude-credentials
          workspaceRef:
            name: my-workspace
        branch: feature/auth
        prompt: |
          The auth module and its tests are ready on branch {{index .Tasks "write-tests" 0 "Results" "branch"}}.

          Review the full diff (git diff main...HEAD) and open a pull request:
          - Write a clear title and description summarizing the changes
          - List the endpoints added and test coverage
          - Reference any relevant issues

          Use `gh pr create` to open the PR.

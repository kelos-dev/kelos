apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    {{- if .Values.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
  name: webhookgateways.kelos.dev
spec:
  group: kelos.dev
  names:
    kind: WebhookGateway
    listKind: WebhookGatewayList
    plural: webhookgateways
    singular: webhookgateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.path
      name: Path
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          WebhookGateway is a per-channel authentication and routing boundary for
          webhook-driven TaskSpawners and SessionSpawners. It owns one inbound path and
          fans out to spawners in its namespace that reference it through gatewayRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WebhookGatewaySpec defines the desired state of a WebhookGateway. Exactly one
              of GitHub, Linear, GitLab, or Generic must be set; the field that is present
              selects the webhook source and carries its provider-specific configuration.
            properties:
              generic:
                description: Generic configures a gateway for arbitrary HTTP POST
                  deliveries.
                type: object
              github:
                description: GitHub configures a gateway for GitHub webhook deliveries.
                properties:
                  apiBaseURL:
                    description: |-
                      APIBaseURL is the GitHub API base URL used for outbound API calls and
                      GitHub App token minting. When empty, "https://api.github.com" is used.
                    type: string
                  credentialsRef:
                    description: |-
                      CredentialsRef references a Secret holding a personal access token under
                      GITHUB_TOKEN or GitHub App credentials under appID, installationID, and
                      privateKey.
                    properties:
                      name:
                        description: Name is the name of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  secretRef:
                    description: |-
                      SecretRef references a Secret holding the HMAC secret under the
                      "webhook-secret" key.
                    properties:
                      name:
                        description: Name is the name of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              gitlab:
                description: GitLab configures a gateway for GitLab webhook deliveries.
                properties:
                  apiBaseURL:
                    description: |-
                      APIBaseURL is the GitLab instance URL used for status reporting (for
                      example "https://gitlab.example.com" or an in-cluster service URL). When
                      empty, "https://gitlab.com" is used.
                    pattern: ^https?://.+
                    type: string
                  credentialsRef:
                    description: |-
                      CredentialsRef references a Secret holding a GitLab access token under
                      the GITLAB_TOKEN key. Required for status reporting on Tasks created
                      through this gateway.
                    properties:
                      name:
                        description: Name is the name of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  secretRef:
                    description: |-
                      SecretRef references a Secret holding the webhook secret token under the
                      "webhook-secret" key.
                    properties:
                      name:
                        description: Name is the name of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              linear:
                description: Linear configures a gateway for Linear webhook deliveries.
                properties:
                  secretRef:
                    description: |-
                      SecretRef references a Secret holding the HMAC secret under the
                      "webhook-secret" key.
                    properties:
                      name:
                        description: Name is the name of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of github, linear, gitlab, or generic must be set
              rule: (has(self.github)?1:0)+(has(self.linear)?1:0)+(has(self.gitlab)?1:0)+(has(self.generic)?1:0)
                == 1
          status:
            description: WebhookGatewayStatus defines the observed state of a WebhookGateway.
            properties:
              message:
                description: Message provides additional information about the current
                  status.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              path:
                description: |-
                  Path is the inbound path this gateway listens on, derived as
                  /webhook/<namespace>/<name>. It is relative to the externally configured
                  webhook host.
                type: string
              phase:
                description: Phase summarizes the gateway's authentication state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

{{- if and .Values.consoleServer.enabled (eq .Values.consoleServer.auth.mode "oidc") }}
{{- range $name := list "kelos-console-user" "kelos-console-admin" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [kelos.dev]
    resources:
      - agentconfigs
      - sessions
      - sessionspawners
      - taskbudgets
      - taskpipelines
      - taskrecords
      - tasks
      - taskspawners
      - workerpools
      - workspaces
    verbs: [get, list]
  - apiGroups: [kelos.dev]
    resources: [sessions]
    verbs: [create, patch, delete]
  - apiGroups: [kelos.dev]
    resources: [sessions/connect, sessions/reset, sessions/suspend, sessions/resume]
    verbs: [create]
  - apiGroups: [kelos.dev]
    resources: [sessions/attachments]
    verbs: [get, create]
  - apiGroups: [kelos.dev]
    resources: [tasks/logs]
    verbs: [get]
  {{- if eq $name "kelos-console-admin" }}
  - apiGroups: [kelos.dev]
    resources: [workspaces, agentconfigs, workerpools]
    verbs: [create, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kelos-console-user, kelos-console-admin]
    verbs: [bind]
  {{- end }}
{{- end }}
{{- end }}

{{- if and .Values.sessionServer .Values.sessionServer.enabled }}
{{- fail "sessionServer values are not supported; use consoleServer instead" }}
{{- end }}
{{- if .Values.consoleServer.enabled }}
{{- if .Values.consoleServer.webPush.enabled }}
{{- $storageNamespace := required "consoleServer.webPush.storageNamespace is required when Web Push is enabled" .Values.consoleServer.webPush.storageNamespace }}
{{- if eq $storageNamespace .Release.Namespace }}
{{- fail "consoleServer.webPush.storageNamespace must be a dedicated namespace, separate from the release namespace" }}
{{- end }}
{{- $_ := required "consoleServer.webPush.secretName is required when Web Push is enabled" .Values.consoleServer.webPush.secretName }}
{{- $subject := required "consoleServer.webPush.subject is required when Web Push is enabled" .Values.consoleServer.webPush.subject }}
{{- if not (or (hasPrefix "mailto:" $subject) (hasPrefix "https://" $subject)) }}
{{- fail "consoleServer.webPush.subject must start with mailto: or https://" }}
{{- end }}
{{- end }}
{{- $auth := .Values.consoleServer.auth }}
{{- $proxyMode := or (eq $auth.mode "oidc") (eq $auth.mode "github") }}
{{- $provider := get $auth $auth.mode | default dict }}
{{- include "kelos.console.validateAuth" . }}
{{- $secretName := .Values.consoleServer.secretName }}
{{- if $proxyMode }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kelos-console-{{ $auth.mode }}
  namespace: {{ .Release.Namespace }}
data:
  oauth2-proxy.yaml: |
    {{- include "kelos.console.proxyConfig" . | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelos-console-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: console-server
spec:
  replicas: {{ .Values.consoleServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kelos
      app.kubernetes.io/component: console-server
  template:
    metadata:
      {{- if $proxyMode }}
      annotations:
        checksum/proxy-config: {{ include "kelos.console.proxyConfig" . | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: kelos
        app.kubernetes.io/component: console-server
    spec:
      serviceAccountName: kelos-console-server
      {{- if $proxyMode }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: console-server
          image: {{ .Values.consoleServer.image }}{{- if .Values.image.tag }}:{{ .Values.image.tag }}{{- end }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          args:
            {{- if $proxyMode }}
            - --bind-address=127.0.0.1:8080
            - --auth-mode={{ $auth.mode }}
            - {{ printf "--external-url=https://%s" (urlParse $provider.redirectURL).host | quote }}
            - {{ printf "--username-prefix=%s" $provider.usernamePrefix | quote }}
            - {{ printf "--groups-prefix=%s" $provider.groupsPrefix | quote }}
            {{- else }}
            - --bind-address=:8080
            - --token-file=/var/run/secrets/kelos-console/token
            {{- end }}
            {{- if .Values.consoleServer.webPush.enabled }}
            - --web-push-namespace={{ .Values.consoleServer.webPush.storageNamespace }}
            - {{ printf "--web-push-subject=%s" .Values.consoleServer.webPush.subject | quote }}
            - --web-push-public-key-file=/var/run/secrets/kelos-web-push/public-key
            - --web-push-private-key-file=/var/run/secrets/kelos-web-push/private-key
            {{- end }}
            - --default-namespace={{ .Values.consoleServer.defaultNamespace }}
            {{- if .Values.consoleServer.secureCookie }}
            - --secure-cookie
            {{- end }}
          {{- if not $proxyMode }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            {{- if .Values.consoleServer.webPush.enabled }}
            - name: web-push-keys
              mountPath: /var/run/secrets/kelos-web-push
              readOnly: true
            {{- end }}
            {{- if $proxyMode }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- else }}
            - name: auth-token
              mountPath: /var/run/secrets/kelos-console
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ ternary "4180" "http" $proxyMode }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ ternary "4180" "http" $proxyMode }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.consoleServer.resources | nindent 12 }}
        {{- if $proxyMode }}
        - name: oauth2-proxy
          image: {{ default "quay.io/oauth2-proxy/oauth2-proxy:v7.15.5" $provider.image | quote }}
          args:
            - --alpha-config=/etc/oauth2-proxy/oauth2-proxy.yaml
            - {{ printf "--redirect-url=%s" $provider.redirectURL | quote }}
            - --email-domain=*
            - --cookie-name={{ ternary "__Host-kelos-console-github" "__Host-kelos-console" (eq $auth.mode "github") }}
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=5m
            - --api-route=^/api/
            - --skip-auth-route=GET=^/(healthz|readyz)$
            - --request-logging=false
            - --auth-logging=false
            {{- if $provider.reverseProxy }}
            - --reverse-proxy=true
            {{- range $provider.trustedProxyIPs }}
            - {{ printf "--trusted-proxy-ip=%s" . | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $provider.secretName }}
                  key: {{ default "cookie-secret" $provider.cookieSecretKey }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/oauth2-proxy
              readOnly: true
            - name: proxy-secret
              mountPath: /var/run/secrets/oauth2-proxy
              readOnly: true
            {{- if and (eq $auth.mode "github") $provider.caSecretName }}
            - name: proxy-ca
              mountPath: /var/run/secrets/oauth2-proxy-ca
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
        {{- end }}
      volumes:
        {{- if .Values.consoleServer.webPush.enabled }}
        - name: web-push-keys
          secret:
            secretName: {{ .Values.consoleServer.webPush.secretName }}
            items:
              - key: public-key
                path: public-key
              - key: private-key
                path: private-key
        {{- end }}
        {{- if $proxyMode }}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: proxy-config
          configMap:
            name: kelos-console-{{ $auth.mode }}
        - name: proxy-secret
          secret:
            secretName: {{ $provider.secretName }}
            items:
              - key: {{ default "client-secret" $provider.clientSecretKey }}
                path: client-secret
        {{- if and (eq $auth.mode "github") $provider.caSecretName }}
        - name: proxy-ca
          secret:
            secretName: {{ $provider.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- else }}
        - name: auth-token
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ .Values.consoleServer.tokenKey }}
                path: token
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kelos-console-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: console-server
spec:
  type: {{ .Values.consoleServer.service.type }}
  selector:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: console-server
  ports:
    - name: http
      port: {{ .Values.consoleServer.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}

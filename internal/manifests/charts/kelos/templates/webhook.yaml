---
# Self-signed issuer used only to mint the webhook serving certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kelos-selfsigned-issuer
  namespace: kelos-system
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  selfSigned: {}
---
# Serving certificate for Kelos admission webhooks and conversion webhooks when
# configured. cert-manager stores it in the kelos-webhook-server-cert Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kelos-serving-cert
  namespace: kelos-system
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  dnsNames:
    - kelos-webhook.kelos-system.svc
    - kelos-webhook.kelos-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: kelos-selfsigned-issuer
  secretName: kelos-webhook-server-cert
---
# Service the API server uses to reach webhooks on the controller.
apiVersion: v1
kind: Service
metadata:
  name: kelos-webhook
  namespace: kelos-system
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  selector:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
    kelos.dev/webhook-server: "true"
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
      protocol: TCP

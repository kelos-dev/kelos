{{- /*
CRDs the chart does not render keep sending conversion requests to the
namespace they name, so refuse to run the kelos-webhook Service elsewhere.
Rendering them with crds.install=true moves them in the same upgrade. lookup
finds nothing under `helm template` or `kelos install`, so only live installs
and upgrades are checked.
*/}}
{{- if not .Values.crds.install }}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "tasks.kelos.dev" }}
{{- $conversionNamespace := dig "spec" "conversion" "webhook" "clientConfig" "service" "namespace" "" $crd }}
{{- if and $conversionNamespace (ne $conversionNamespace .Release.Namespace) }}
{{- fail (printf "CRD tasks.kelos.dev sends conversion requests to the kelos-webhook Service in namespace %s, but this release runs it in namespace %s; see \"Release Namespace\" in the chart README" $conversionNamespace .Release.Namespace) }}
{{- end }}
{{- end }}
---
# Self-signed issuer used only to mint the webhook serving certificate.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kelos-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  selfSigned: {}
---
# Serving certificate for the kelos CRD conversion webhook (shared by all
# kelos CRDs). cert-manager stores it in the kelos-webhook-server-cert Secret
# and, via the cert-manager.io/inject-ca-from annotation on each kelos CRD,
# injects the CA bundle into the CRD's conversion clientConfig.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kelos-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  dnsNames:
    - kelos-webhook.{{ .Release.Namespace }}.svc
    - kelos-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: kelos-selfsigned-issuer
  secretName: kelos-webhook-server-cert
---
# Service the API server uses to reach the conversion webhook on the controller.
apiVersion: v1
kind: Service
metadata:
  name: kelos-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
spec:
  selector:
    app.kubernetes.io/name: kelos
    app.kubernetes.io/component: manager
    # Only pods that actually serve the webhook on 9443 carry this label, so an
    # old controller pod lingering during a rolling upgrade is never selected.
    kelos.dev/conversion-webhook: "true"
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
      protocol: TCP

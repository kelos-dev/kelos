apiVersion: kelos.dev/v1alpha2
kind: SessionSpawner
metadata:
  name: agora-pr-responder
spec:
  when:
    githubWebhook:
      gatewayRef:
        name: agora
      repository: kelos-dev/agora
      excludeAuthors:
        - kelos-bot[bot]
      events:
        - issue_comment
        - pull_request_review
      filters:
        - event: issue_comment
          action: created
          bodyPattern: '(?m)^/kelos pick-up[ \t]*\r?$'
          commentOn: PullRequest
          state: open
          author: gjkim42
        - event: pull_request_review
          action: submitted
          bodyPattern: '(?m)^/kelos pick-up[ \t]*\r?$'
          state: open
          draft: false
          author: gjkim42
  sessionTemplate:
    volumeClaimTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    worker:
      workspaceRef:
        name: agora-session-agent
      model: gpt-6-astra
      effort: xhigh
      type: codex
      credentials:
        type: oauth
        secretRef:
          name: kelos-credentials
      podOverrides:
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "20Gi"
          limits:
            ephemeral-storage: "20Gi"
        env:
          - name: GIT_AUTHOR_NAME
            value: "Gunju Kim"
          - name: GIT_AUTHOR_EMAIL
            value: "gjkim042@gmail.com"
          - name: GIT_COMMITTER_NAME
            value: "Gunju Kim"
          - name: GIT_COMMITTER_EMAIL
            value: "gjkim042@gmail.com"
      agentConfigRefs:
        - name: base-agent
    initialBranch: "{{.Branch}}"
    initialPrompt: |
      Let's address {{.URL}}
      Find the best way to address it.

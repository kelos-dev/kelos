apiVersion: kelos.dev/v1alpha2
kind: SessionSpawner
metadata:
  name: kanon-workers
spec:
  when:
    githubWebhook:
      repository: kelos-dev/kanon
      excludeAuthors:
        - kelos-bot[bot]
      events:
        - issue_comment
      filters:
        - event: issue_comment
          action: created
          bodyPattern: '(?m)^/kelos pick-up[ \t]*\r?$'
          commentOn: Issue
          state: open
          author: gjkim42
  sessionTemplate:
    volumeClaimTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    worker:
      workspaceRef:
        name: kanon-session-agent
      model: gpt-5.6-sol
      effort: xhigh
      type: codex
      credentials:
        type: oauth
        secretRef:
          name: kelos-credentials
      podOverrides:
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "20Gi"
          limits:
            ephemeral-storage: "20Gi"
        env:
          - name: GIT_AUTHOR_NAME
            value: "Gunju Kim"
          - name: GIT_AUTHOR_EMAIL
            value: "gjkim042@gmail.com"
          - name: GIT_COMMITTER_NAME
            value: "Gunju Kim"
          - name: GIT_COMMITTER_EMAIL
            value: "gjkim042@gmail.com"
      agentConfigRefs:
        - name: base-agent
    initialBranch: "kanon-task-{{.Number}}"
    initialPrompt: |
      Let's address {{.URL}}
      Find the best way to address it.
      When behavior differs by command, flag, scope, or guard outcome, test each
      affected path directly instead of relying on coverage through another path.

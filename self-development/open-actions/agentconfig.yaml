apiVersion: kelos.dev/v1alpha2
kind: AgentConfig
metadata:
  name: open-actions-dev-agent
spec:
  agentsMD: |
    # Open Actions Development Agent

    Open Actions (github.com/kelos-dev/open-actions) is a Kubernetes-native,
    self-hosted control plane for running GitHub Actions workflows in the
    team's own cluster. Its product goal is full behavioral compatibility with
    GitHub Actions. GitHub webhooks trigger workflow discovery, and `Project`,
    `Runner`, `WorkflowRun`, and `WorkflowJob` resources drive execution.

    ## Environment
    You are running in an ephemeral container environment. Your file system
    changes disappear after the task completes. Persist work by creating PRs,
    issues, or comments.

    ## Identity
    - When commenting on issues or PRs, always start with "🤖 **Open Actions Agent** @gjkim42\n\n"
      so it is clearly distinguishable from human comments and triggers a notification

    ## Standards
    - Do not create duplicate issues — check existing issues first with `gh issue list`
    - Keep changes minimal and focused

    ## Project Conventions
    - Use Makefile targets instead of discovering build/test commands yourself:
      - `make verify` — verify formatting, modules, generated artifacts, and vet
      - `make update` — update generated Go types, CRDs, formatting, and module metadata
      - `make test` — run unit and schema tests
      - `make test-e2e` — run the Kind end-to-end test
      - `make build` — build the CLI, controller, and runner binaries
    - Logging conventions: keep messages concise and free of terminal punctuation, and put variable values and machine-readable categories in structured fields
    - Commit messages: do not include PR links in commit messages
    - Treat the current GitHub Actions documentation at https://docs.github.com/actions as the normative specification for workflow syntax, behavior, and security. Missing or different documented behavior is a compatibility gap, not an intentional support boundary. Verify workflow changes against the relevant documentation and add conformance tests; if a gap cannot be closed in the current change, reject it explicitly, document it, and link a tracking issue. Kubernetes-specific features must not change the meaning or security boundaries of a valid GitHub Actions workflow.
    - Do not trade one compatible GitHub Actions behavior for another. A replacement must preserve existing trigger coverage, distinct workflow-run identities, and GitHub UI and CLI reporting and control paths until it provides the documented equivalent; documenting or tracking a regression does not make it acceptable.
    - Treat informer-cached reads and earlier workflow checks as potentially stale. Before assigning or starting work, creating credentials, publishing mutable image tags, or mutating cluster state, re-read authoritative state and revalidate eligibility immediately before the side effect.
    - Make create-and-follow-up workflows retry-safe across stale caches, concurrent reconciles, and partial failures. Use deterministic identities or authoritative live reads to prevent duplicate children, re-run or verify remaining side effects on existing-object paths, and exclude legitimately mutable fields from idempotency comparisons.
    - Classify dependency and API failures consistently across reconciliation phases. Preserve transient unavailability as retryable instead of converting it into a terminal validation or condition result, and test the observable retry state through the production path. Map a failure to a feature-specific terminal reason only when authoritative lifecycle state or field-specific API details prove that cause; a phase annotation or unrelated validation failure is not proof. For GitHub rate limits, require a rate-limit response rather than inferring one from unrelated exhausted-quota headers, scope cooldowns no wider than the known installation or service limit, and do not suppress unrelated errors when aggregating failures.
    - Treat multiple workflow candidates from one webhook as independent event paths. Validate each candidate before committing shared discovery state, and do not let repository-controlled failure or disabling one candidate suppress another documented workflow path. Test each candidate through the reconciliation entry point, including invalid and disabled sibling paths.
    - Treat TTL-managed history and persisted planning artifacts as independently deletable. A surviving resource or read path must not assume its referenced source still exists: use retained state or degrade optional views, and convert unrecoverable missing state into an observable terminal result instead of a misleading not-found response or an endless retry. Test deletion between creation and reconciliation and after completion.
    - Keep request, reconcile, and retry hot paths bounded. Cap or paginate list-backed responses, put no-op and idempotency checks before uncached or external reads, and persist completed sub-work so retries do not repeat expensive calls.
    - Tests for stale-state decisions must model cache/API divergence. Validation and security-boundary tests must invoke the real enforcement layer and include rejection cases for every independent constraint, including numeric bounds and Kubernetes structural list or map semantics; rendering templates or asserting only part of a Pod spec does not prove schema rejection or isolation.
    - When shared behavior spans materially distinct production paths, test each path through its real caller and cover its path-specific lifecycle and backing-store assumptions. When one component consumes another component's exact log messages or other textual records, test every deterministic variant at both the producer and the consumer; parser coverage does not prove that the producer emits the required record. When behavior selects among ordered sources or fallbacks, use distinguishable fixtures for every branch and assert which source won; coincident defaults or zero values must not let incorrect precedence pass. When changing or repurposing tests and fixtures, identify the paths they cover and retain positive coverage; coverage for new behavior does not replace coverage of an existing branch or transport. A test that skips when optional tools are unavailable cannot be the only coverage of deterministic logic; pair it with environment-independent unit coverage of each branch.
    - Authorization changes must retain positive and negative tests for every supported credential and session path. Keep installed end-to-end coverage of credential delivery even when adjacent endpoints become public. Give bearer credentials only the permissions and lifetime required by the path that receives them; derive expiry from the actual enforced scheduling, execution, and cleanup window rather than a looser theoretical maximum when the narrower deadline is already known.
    - When behavior depends on Kubernetes or runner integration, exercise the installed happy path with `make test-e2e`, including generated chart/RBAC and controller-to-runner transport. Fake clients, recorders, and component unit tests do not prove that the installed feature works.
    - When implementing repository behavior with Git, preserve GitHub API semantics for file types and refs. Test network-sensitive behavior against a remote that enforces the fetch capabilities under test and cover shallow and full-history repositories; local-path fixtures can ignore fetch filters and hide unbounded history transfers.
    - Treat persisted cross-component data and every controller-to-runner interface, including job plans, CLI arguments, environment variables, mounted files, and credentials, as versioned upgrade contracts. Gate incompatible interface changes on the job-plan version or an explicit capability, preserve in-flight and pre-upgrade data, document the supported upgrade order, and positively test both skew directions plus current and prior-version or absent-field paths.
    - Before adding an optional API or configuration field, or another path that creates an existing resource kind, compare its omitted and operator-configured behavior with every established path. Preserve existing defaults unless a behavior change is intentional; when it is, align dependent limits and timeouts and state the change in durable docs and the release note.
    - Preserve scalar meaning when workflow YAML, webhook JSON, or persisted `any` values cross serialization boundaries. Use number-preserving decoding or normalize scalars before persistence, and test large integers with trailing zeros through direct and persisted or restarted paths.
    - Do not let reconcile arrival order or the presence of an intermediate status field define concurrency or queue order. Persist and compare an explicit ordering key or serialize gate entry, and test inverted arrival, simultaneous wakeups, retries, and restarts.
    - Preserve why a job reached each terminal or non-running state when later behavior or reporting depends on it. A coarse `terminal`, `cancelled`, `skipped`, or status-present check does not prove that work is reusable, successful, or has reached a lifecycle gate. When mapping state to a public conclusion or metric label, define precedence between explicit results and condition reasons, and test every producer of each conclusion. Distinguish matrix fail-fast, concurrency replacement, manual cancellation, dependency skips, and `continue-on-error`; recompute aggregate and dependent outcomes across retries and reruns, and test mixed-result matrices with dependents. Populate phase-sensitive expression contexts from actual execution state at every supported evaluation site. Do not replace available live state with an optimistic default such as `success`; test `job.status` and status functions after failure and cancellation through workflow steps, composite-action fields and outputs, and action input-default evaluation.
    - Workflow parsing must reject behavior that is not yet implemented and duplicate YAML mapping keys instead of silently ignoring input or applying last-value-wins behavior. Verify behavior against the current GitHub Actions documentation before calling it unsupported, and document and track every resulting compatibility gap.
    - Treat repository-controlled parsing, expression evaluation, and combinatorial expansion as resource-bounded. Cap source size, AST depth and node count, incremental evaluated output, and traversal work before allocating it; bound candidate or visited combinations independently of surviving output so filters cannot bypass limits. After interpolation, reapply each field's limit and aggregate job or workflow budgets.
    - Expression functions must follow GitHub Actions' documented coercion and error semantics instead of inventing false results or default argument values.
    - Keep repository documentation, PR descriptions, and release notes aligned with implemented user-visible behavior and operational prerequisites, including supported syntax, enforced limits, changed defaults, upgrade requirements, terminal states, timeouts, access boundaries, and permissions. Treat condition-reason tables and expression-context or result-value lists as exhaustive contracts, updating every applicable row when behavior changes. Treat runnable examples as maintained contracts: build or execute them in CI when practical, and when defaults or provided baselines change, update examples so they still demonstrate behavior outside the baseline instead of redundantly showing a built-in capability. Never claim authentication or another security property that the relevant path does not enforce, and do not leave required information only in PR descriptions. Document pull and publish permissions separately; public GHCR visibility does not let a repository `GITHUB_TOKEN` push unless the package is linked to the repository or grants it Actions write access.

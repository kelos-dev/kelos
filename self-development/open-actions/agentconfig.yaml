apiVersion: kelos.dev/v1alpha2
kind: AgentConfig
metadata:
  name: open-actions-dev-agent
spec:
  agentsMD: |
    # Open Actions Development Agent

    Open Actions (github.com/kelos-dev/open-actions) is a Kubernetes-native,
    self-hosted control plane that plans, schedules, and executes a supported
    subset of GitHub Actions workflows in the team's own cluster. GitHub
    webhooks trigger workflow discovery, and `Project`, `Runner`,
    `WorkflowRun`, and `WorkflowJob` resources drive execution.

    ## Environment
    You are running in an ephemeral container environment. Your file system
    changes disappear after the task completes. Persist work by creating PRs,
    issues, or comments.

    ## Identity
    - When commenting on issues or PRs, always start with "🤖 **Open Actions Agent** @gjkim42\n\n"
      so it is clearly distinguishable from human comments and triggers a notification

    ## Standards
    - Do not create duplicate issues — check existing issues first with `gh issue list`
    - Keep changes minimal and focused

    ## Project Conventions
    - Use Makefile targets instead of discovering build/test commands yourself:
      - `make verify` — verify formatting, modules, generated artifacts, and vet
      - `make update` — update generated Go types, CRDs, formatting, and module metadata
      - `make test` — run unit and schema tests
      - `make test-e2e` — run the Kind end-to-end test
      - `make build` — build the CLI, controller, and runner binaries
    - Logging conventions: start log messages with capital letters and do not end with punctuation
    - Commit messages: do not include PR links in commit messages
    - Treat informer-cached reads and earlier workflow checks as potentially stale. Before assigning or starting work, creating credentials, publishing mutable image tags, or mutating cluster state, re-read authoritative state and revalidate eligibility immediately before the side effect.
    - Classify dependency and API failures consistently across reconciliation phases. Preserve transient unavailability as retryable instead of converting it into a terminal validation or condition result, and test the observable retry state through the production path.
    - Keep request, reconcile, and retry hot paths bounded. Cap or paginate list-backed responses, put no-op and idempotency checks before uncached or external reads, and persist completed sub-work so retries do not repeat expensive calls.
    - Tests for stale-state decisions must model cache/API divergence. Validation and security-boundary tests must invoke the real enforcement layer and include invalid cases; rendering templates or asserting only part of a Pod spec does not prove schema rejection or isolation.
    - Authorization changes must retain positive and negative tests for every supported credential and session path. Keep installed end-to-end coverage of credential delivery even when adjacent endpoints become public.
    - When behavior depends on Kubernetes or runner integration, exercise the installed happy path with `make test-e2e`, including generated chart/RBAC and controller-to-runner transport. Fake clients, recorders, and component unit tests do not prove that the installed feature works.
    - When implementing repository behavior with Git, preserve GitHub API semantics for file types and refs. Test network-sensitive behavior against a remote that enforces the fetch capabilities under test and cover shallow and full-history repositories; local-path fixtures can ignore fetch filters and hide unbounded history transfers.
    - Treat persisted and versioned cross-component data as upgrade contracts. Preserve in-flight and pre-upgrade data when changing their formats, document the supported upgrade order, and positively test both current data and the prior-version or absent-field fallback.
    - Workflow parsing must reject unsupported field combinations, unsupported event actions, and duplicate YAML mapping keys instead of silently ignoring input or applying last-value-wins behavior.
    - Treat repository-controlled parsing and expression evaluation as resource-bounded. Cap source size, AST depth and node count, and incremental evaluated output before allocating it; after interpolation, reapply each field's limit and aggregate job or workflow budgets.
    - Expression functions must reject unsupported argument types instead of returning false or silently substituting default values.
    - Keep durable repository documentation aligned with user-visible behavior and operational prerequisites, including supported syntax, enforced limits, terminal states, timeouts, and permissions; do not leave required information only in PR descriptions. Document pull and publish permissions separately; public GHCR visibility does not let a repository `GITHUB_TOKEN` push unless the package is linked to the repository or grants it Actions write access.

# TaskSpawner triggered by GitHub issues with specific labels
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: fix-bugs
spec:
  when:
    githubIssues:
      labels:
        - bug
      excludeLabels:
        - wontfix
      state: open
      pollInterval: 5m
  taskTemplate:
    type: claude-code
    effort: high
    workspaceRef:
      name: my-workspace
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    branch: "fix-{{.Number}}"
    promptTemplate: |
      Fix the following GitHub issue and open a PR.

      Issue #{{.Number}}: {{.Title}}

      {{.Body}}
    ttlSecondsAfterFinished: 3600
  maxConcurrency: 3
---
# TaskSpawner with cron schedule
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: daily-audit
spec:
  when:
    cron:
      schedule: "0 9 * * 1-5"
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: my-workspace
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    promptTemplate: |
      Run a security audit on the codebase.
      Triggered at: {{.Time}}
    ttlSecondsAfterFinished: 7200
  maxConcurrency: 1
---
# Fork workflow — discover upstream issues, work in a fork
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: fork-worker
spec:
  when:
    githubIssues:
      repo: https://github.com/upstream-org/upstream-repo.git
      labels:
        - help-wanted
      state: open
      pollInterval: 5m
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: my-fork
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    branch: "kelos-task-{{.Number}}"
    promptTemplate: |
      Fix this upstream issue and open a PR from the fork.

      Issue #{{.Number}}: {{.Title}}

      {{.Body}}
    ttlSecondsAfterFinished: 3600
  maxConcurrency: 3
---
# TaskSpawner with comment-based triggers, authorization, and priority labels
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: comment-triggered
spec:
  when:
    githubIssues:
      labels:
        - agent-ready
      commentPolicy:
        triggerComment: "/kelos pick-up"
        excludeComments:
          - "/kelos needs-input"
        allowedUsers:
          - my-github-username
        minimumPermission: write
      priorityLabels:
        - priority/critical-urgent
        - priority/important-soon
        - priority/backlog
      pollInterval: 1m
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: my-workspace
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    agentConfigRefs:
      - name: my-agent-config
    branch: "kelos-task-{{.Number}}"
    promptTemplate: |
      Fix issue #{{.Number}}: {{.Title}}

      {{.Body}}

      Comments:
      {{.Comments}}
  maxConcurrency: 5
  maxTotalTasks: 100
---
# TaskSpawner with Jira source
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: jira-worker
spec:
  when:
    jira:
      baseUrl: https://mycompany.atlassian.net
      project: PROJ
      jql: "status = 'To Do' AND priority in (High, Critical)"
      secretRef:
        name: jira-credentials
      pollInterval: 10m
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: my-workspace
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    promptTemplate: |
      Fix Jira ticket {{.ID}}: {{.Title}}

      {{.Body}}
  maxConcurrency: 2
---
# TaskSpawner with GitLab source (instance URL and project derive from the Workspace repo;
# the Workspace must set provider: gitlab and its secret's GITLAB_TOKEN key holds the token)
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: gitlab-worker
spec:
  when:
    gitlab:
      types: ["issues", "mergeRequests"]
      labels: ["kelos"]
      commentPolicy:
        triggerComment: "/kelos fix"
        allowedUsers: ["alice"]
      reporting:
        comments:
          mode: Sticky
      pollInterval: 2m
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: my-gitlab-workspace
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    branch: "{{if .Branch}}{{.Branch}}{{else}}kelos-issue-{{.Number}}{{end}}"
    promptTemplate: |
      Work on GitLab {{.Kind}} #{{.Number}}: {{.Title}}

      {{.Body}}
  maxConcurrency: 2
---
# TaskSpawner distributing generated Tasks across multiple agent accounts
apiVersion: kelos.dev/v1alpha2
kind: TaskSpawner
metadata:
  name: multi-account-worker
spec:
  when:
    githubIssues:
      labels:
        - agent-ready
      pollInterval: 5m
  credentials:
    - name: account-a
      type: oauth
      secretRef:
        name: claude-account-a
    - name: account-b
      type: oauth
      secretRef:
        name: claude-account-b
  taskTemplate:
    worker:
      type: claude-code
      workspaceRef:
        name: my-workspace
    branch: "kelos-task-{{.Number}}"
    promptTemplate: |
      Fix issue #{{.Number}}: {{.Title}}

      {{.Body}}
  maxConcurrency: 4
